<!--
 ============ সেটআপ নির্দেশনা ============
 ১) Firestore Rules (শুধু টেস্টিংয়ের জন্য — প্রোডাকশনে ব্যবহার করবেন না):
    rules_version = '2';
    service cloud.firestore { match /databases/{database}/documents {
      match /{document=**} { allow read, write: if true; } } }
    Storage Rules-এও একইভাবে read, write অনুমতি দিন।
 ২) OneSignal ড্যাশবোর্ড → Settings → Push & In-App → Permission Prompt যোগ করুন
    এবং Site URL দিন: https://mrinal1271.github.io/my-website/
 ৩) GitHub-এর my-website ফোল্ডারের রুটে এই ফাইলগুলো রাখুন:
    index.html, OneSignalSDKWorker.js, sw.js, manifest.json, icon-192.png, icon-512.png
-->

<script>
// OneSignal ইনিশিয়ালাইজ (সাবফোল্ডারের জন্য serviceWorkerParam ও serviceWorkerPath আবশ্যক)
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
        appId: "6f039946-596a-4750-a70e-3eac2f827f6c",
        serviceWorkerParam: { scope: "/my-website/" },

</script>

<body>
<div id="toasts" class="fixed top-3 right-3 z-[100] space-y-2"></div>
<div id="app" class="max-w-xl mx-auto min-h-screen bg-white relative"><div class="pt-40"><div class="spin"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp, arrayUnion, arrayRemove, increment, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// ===== কনফিগারেশন =====
const firebaseConfig = { projectId:"group-app-ab54f", authDomain:"group-app-ab54f.firebaseapp.com", storageBucket:"group-app-ab54f.firebasestorage.app", messagingSenderId:"1014775593877", appId:"1:1014775593877:web:f88fa6cd7b812a7ab3549c", measurementId:"G-WNE7ZNZK46" };
const ADMIN_PHONE = "01866989184";
const OS_APP_ID = "6f039946-596a-4750-a70e-3eac2f827f6c";
const OS_REST_KEY = "os_v2_app_n4bzsrsznjdvbjyoh2wc7at7nqlfqna6t7be3kewtiulwjm6yplndusra3wqdspauw5z2jxf4ogwu5pt7texehzagjmvc5obsgys6gi";
const SITE = "https://mrinal1271.github.io/my-website/";
const db = getFirestore(initializeApp(firebaseConfig));
const storage = getStorage();

// ===== স্টেট =====
let me = null, isAdmin = false, tab = 'home', batchId = null;
let posts = [], users = [], group = { name:'কমিউনিটি', description:'', imageUrl:'' };
let firstPostLoad = true, chatWith = null, chatUnsub = null, allMsgs = [], deferredPrompt = null, pollOpts = 2, postType = 'text';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// বাংলা সংখ্যায় রূপান্তর
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
// সময় ফরম্যাট
function ago(ts) {
    if (!ts?.toMillis) return 'এইমাত্র';
    const s = (Date.now() - ts.toMillis()) / 1000;
    if (s < 60) return 'এইমাত্র';
    if (s < 3600) return bn(Math.floor(s/60)) + ' মিনিট আগে';
    if (s < 86400) return bn(Math.floor(s/3600)) + ' ঘন্টা আগে';
    if (s < 604800) return bn(Math.floor(s/86400)) + ' দিন আগে';
    return ts.toDate().toLocaleDateString('bn-BD');
}
const clock = ts => ts?.toDate ? ts.toDate().toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'}) : '';
// টোস্ট বার্তা
function toast(msg, err) {
    const d = document.createElement('div');
    d.className = `px-4 py-2 rounded-lg shadow-lg text-white text-sm ${err ? 'bg-red-500' : 'bg-indigo-600'}`;
    d.textContent = msg; $('toasts').appendChild(d); setTimeout(() => d.remove(), 3500);
}
// নোটিফিকেশন শব্দ (Web Audio API)
function playNotificationSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
        setTimeout(() => { try { ctx.close(); } catch(e){} }, 1000);
    } catch (e) {}
}
// OneSignal পুশ পাঠানো
async function sendOneSignalPush(title, message, postId) {
    try {
        const payload = { app_id: OS_APP_ID, included_segments: ["Subscribed Users"], headings: { en: title }, contents: { en: message }, url: postId ? `${SITE}?post=${postId}` : SITE };
        const res = await fetch("https://onesignal.com/api/v1/notifications", { method:"POST", headers:{ "Content-Type":"application/json; charset=utf-8", "Authorization":"Basic " + OS_REST_KEY }, body: JSON.stringify(payload) });
        console.log('Push response:', await res.json());
    } catch (e) { console.error(e); }
}
// ফাইল আপলোড (Firebase Storage)
async function upload(file, folder) {
    const r = ref(storage, `${folder}/${Date.now()}_${file.name}`);
    await uploadBytes(r, file); return getDownloadURL(r);
}

// ===== স্টার্টআপ =====
// বর্তমান ব্যাচ আনা (না থাকলে তৈরি)
async function loadBatch() {
    const r = doc(db, 'settings', 'currentBatch'), s = await getDoc(r);
    if (s.exists()) batchId = s.data().batchId;
    else { batchId = 'b' + Date.now(); await setDoc(r, { batchId, startedAt: serverTimestamp() }); }
}
async function boot() {
    await loadBatch();
    const id = localStorage.getItem('cp_uid');
    if (id) {
        const s = await getDoc(doc(db, 'users', id));
        if (s.exists()) return enter({ id, ...s.data() });
        localStorage.removeItem('cp_uid');
    }
    showAuth();
}
// ইউজার প্রবেশ ও ব্লক চেক
function enter(u) {
    isAdmin = u.phone === ADMIN_PHONE;
    if (u.blocked && !isAdmin) return showBlocked();
    me = u; localStorage.setItem('cp_uid', u.id);
    updateDoc(doc(db, 'users', u.id), { lastSeen: serverTimestamp() }).catch(()=>{});
    renderShell(); startListeners();
}
function showBlocked() {
    $('app').innerHTML = `<div class="p-10 pt-32 text-center"><div class="text-5xl mb-4">🚫</div><h2 class="text-xl font-bold mb-2">আপনার অ্যাক্সেস বন্ধ</h2><p class="text-gray-500 mb-6">অ্যাডমিন আপনাকে ব্লক করেছেন।</p><button id="lo" class="px-5 py-2 grad text-white rounded-lg">লগআউট</button></div>`;
    $('lo').onclick = logout;
}
function logout() { localStorage.removeItem('cp_uid'); location.href = location.pathname; }

// ===== রেজিস্ট্রেশন =====
function showAuth() {
    $('app').innerHTML = `<div class="grad min-h-screen flex items-center p-6"><div class="bg-white rounded-2xl p-6 w-full shadow-xl">
    <div class="text-center text-4xl mb-2">💬</div><h1 class="text-xl font-bold text-center mb-1">কমিউনিটিতে স্বাগতম</h1><p class="text-center text-gray-500 text-sm mb-5">যোগ দিতে তথ্য দিন</p>
    <input id="rn" class="w-full border rounded-lg p-3 mb-3" placeholder="আপনার নাম *">
    <input id="rp" type="tel" class="w-full border rounded-lg p-3 mb-3" placeholder="ফোন নম্বর *">
    <input id="rg" type="email" class="w-full border rounded-lg p-3 mb-4" placeholder="জিমেইল (ঐচ্ছিক)">
    <button id="rb" class="w-full grad text-white py-3 rounded-lg font-semibold">যোগ দিন</button>
    <button class="inst hidden w-full mt-3 border border-indigo-500 text-indigo-600 py-2 rounded-lg">📲 অ্যাপ ইনস্টল করুন</button></div></div>`;
    $('rb').onclick = register; bindInstall();
}
// ফর্ম সাবমিট → পারমিশন পপআপ
function register() {
    const name = $('rn').value.trim(), phone = $('rp').value.trim().replace(/\s/g,''), gmail = $('rg').value.trim();
    if (!name || !phone) return toast('নাম ও ফোন নম্বর আবশ্যক', true);
    if (!/^01\d{9}$/.test(phone)) return toast('সঠিক ১১ ডিজিটের ফোন নম্বর দিন', true);
    const m = document.createElement('div');
    m.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6';
    m.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center max-w-sm"><div class="text-5xl mb-3">🔔</div><p class="font-semibold mb-5">কোনো কিছু আপডেট মিস করতে না চাইলে এলাও বাটনে ক্লিক করুন</p><button id="al" class="w-full grad text-white py-3 rounded-lg font-semibold">✅ এলাও করুন</button></div>`;
    document.body.appendChild(m);
    $('al').onclick = async () => {
        let perm = 'denied';
        try { perm = await Notification.requestPermission(); } catch (e) {}
        m.remove();
        if (perm !== 'granted') return toast('নোটিফিকেশন এলাও না করলে গ্রুপে ঢোকা যাবে না', true);
        try { window.OneSignal?.Notifications?.requestPermission?.(); } catch (e) {}
        await saveUser(name, phone, gmail);
    };
}
// ইউজার সেভ (ফোন আগে থাকলে লগইন)
async function saveUser(name, phone, gmail) {
    try {
        const q = await getDocs(query(collection(db, 'users'), where('phone', '==', phone)));
        if (!q.empty) { const d = q.docs[0]; return enter({ id: d.id, ...d.data() }); }
        const data = { name, phone, gmail, batchId, blocked: false, joinedAt: serverTimestamp(), lastSeen: serverTimestamp(), viewedPosts: [] };
        const r = await addDoc(collection(db, 'users'), data);
        enter({ id: r.id, ...data, joinedAt: null });
    } catch (e) { toast('সমস্যা হয়েছে, আবার চেষ্টা করুন', true); }
}

// ===== মূল কাঠামো =====
function renderShell() {
    const tabs = [['home','🏠','হোম'],['members','👥','সদস্য'],['support','💬','সাপোর্ট'],['profile','👤','প্রোফাইল']];
    if (isAdmin) tabs.push(['admin','⚙️','প্যানেল']);
    $('app').innerHTML = `
    <header class="grad text-white p-3 flex items-center gap-3 sticky top-0 z-30">
      <img id="gi" class="w-10 h-10 rounded-full bg-white/30 object-cover" alt="">
      <div class="flex-1 min-w-0"><div id="gn" class="font-bold truncate"></div><div id="gd" class="text-xs opacity-80 truncate"></div></div>
      <button class="inst hidden text-xs bg-white/20 px-2 py-1 rounded">📲 ইনস্টল</button>
    </header>
    <main id="main" class="pb-20"></main>
    <nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white border-t flex z-30">
      ${tabs.map(t => `<button data-t="${t[0]}" class="nb flex-1 py-2 text-xs"><div class="text-xl">${t[1]}</div>${t[2]}</button>`).join('')}
    </nav>
    <div id="full" class="hidden fixed inset-0 bg-black z-[90] flex items-center justify-center"><button id="fx" class="absolute top-4 right-4 text-white text-3xl">✕</button><div id="fc" class="w-full"></div></div>`;
    document.querySelectorAll('.nb').forEach(b => b.onclick = () => { tab = b.dataset.t; if (tab !== 'support') closeChat(); render(); });
    $('fx').onclick = () => { $('full').classList.add('hidden'); $('fc').innerHTML = ''; };
    bindInstall(); renderHeader(); render();
}
function renderHeader() {
    if (!$('gn')) return;
    $('gn').textContent = group.name; $('gd').textContent = group.description;
    $('gi').src = group.imageUrl || 'icon-192.png';
}
function render() {
    if (!$('main')) return;
    document.querySelectorAll('.nb').forEach(b => b.classList.toggle('text-indigo-600', b.dataset.t === tab));
    document.querySelectorAll('.nb').forEach(b => b.classList.toggle('font-bold', b.dataset.t === tab));
    ({ home: renderHome, members: renderMembers, support: renderSupport, profile: renderProfile, admin: renderAdmin }[tab])();
}

// ===== রিয়েলটাইম লিসনার =====
function startListeners() {
    onSnapshot(doc(db, 'settings', 'group'), s => { if (s.exists()) group = { ...group, ...s.data() }; renderHeader(); });
    // নিজের ব্লক স্ট্যাটাস
    onSnapshot(doc(db, 'users', me.id), s => { if (s.exists() && s.data().blocked && !isAdmin) showBlocked(); });
    onSnapshot(query(collection(db, 'users'), orderBy('joinedAt', 'desc')), s => {
        users = s.docs.map(d => ({ id: d.id, ...d.data() })); if (tab === 'members' || tab === 'admin') render();
    });
    onSnapshot(query(collection(db, 'posts'), orderBy('createdAt', 'desc')), s => {
        posts = s.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!firstPostLoad) s.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) newPostAlert(c.doc.data()); });
        firstPostLoad = false; if (tab === 'home') { renderHome(); handleDeepLink(); }
    });
    // সাপোর্ট মেসেজ
    onSnapshot(collection(db, 'supportMessages'), s => {
        allMsgs = s.docs.map(d => ({ id: d.id, ...d.data() }));
        allMsgs.forEach(m => { // পৌঁছানো স্ট্যাটাস
            const mine = isAdmin ? m.sender === 'user' : (m.userId === me.id && m.sender === 'admin');
            if (mine && !m.delivered) updateDoc(doc(db, 'supportMessages', m.id), { delivered: true }).catch(()=>{});
        });
        if (tab === 'support') renderSupport(true);
    });
}
// নতুন পোস্টের অ্যালার্ট
function newPostAlert(p) {
    playNotificationSound(); toast('📢 নতুন পোস্ট এসেছে');
    try { if (Notification.permission === 'granted' && document.hidden) new Notification(group.name, { body: p.text || 'নতুন পোস্ট', icon: 'icon-192.png' }); } catch (e) {}
}
// ডিপ লিংক (?post=ID) হ্যান্ডলার
let deepDone = false;
function handleDeepLink() {
    const id = new URLSearchParams(location.search).get('post');
    if (!id || deepDone) return;
    const el = $('post-' + id); if (!el) return;
    deepDone = true; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('hl');
}

// ===== হোম =====
function renderHome() {
    const m = $('main');
    if (!posts.length) { m.innerHTML = `<div class="text-center text-gray-400 pt-32"><div class="text-5xl mb-2">📭</div>এখনো কোনো পোস্ট নেই</div>`; return; }
    m.innerHTML = posts.map(postHTML).join('');
    m.querySelectorAll('[data-like]').forEach(b => b.onclick = () => toggleLike(b.dataset.like));
    m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('পোস্টটি মুছে ফেলবেন?') && deleteDoc(doc(db, 'posts', b.dataset.del)));
    m.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => vote(b.dataset.pid, b.dataset.vote));
    m.querySelectorAll('[data-full]').forEach(b => b.onclick = () => openFull(b.dataset.full, b.dataset.kind));
    posts.forEach(markViewed); handleDeepLink();
}
function postHTML(p) {
    const liked = (p.likes || []).includes(me.id), voted = Object.values(p.votes || {}).some(a => (a || []).includes(me.id));
    let body = p.text ? `<p class="whitespace-pre-wrap mb-2">${esc(p.text)}</p>` : '';
    if (p.type === 'image') body += `<img src="${esc(p.imageUrl)}" data-full="${esc(p.imageUrl)}" data-kind="img" class="rounded-lg w-full cursor-pointer">`;
    if (p.type === 'video') body += `<video src="${esc(p.videoUrl)}" data-full="${esc(p.videoUrl)}" data-kind="vid" class="rounded-lg w-full" controls></video>`;
    if (p.type === 'link') body += `<a href="${esc(p.linkUrl)}" target="_blank" rel="noopener" class="text-indigo-600 underline break-all">🔗 ${esc(p.linkUrl)}</a>`;
    if (p.type === 'poll') {
        const total = Object.values(p.votes || {}).reduce((a, v) => a + (v || []).length, 0);
        body += (p.options || []).map((o, i) => {
            const c = (p.votes?.[i] || []).length, pct = total ? Math.round(c / total * 100) : 0;
            return `<button ${voted ? 'disabled' : ''} data-pid="${p.id}" data-vote="${i}" class="relative block w-full text-left border rounded-lg p-2 mb-1 overflow-hidden"><div class="absolute inset-y-0 left-0 bg-indigo-100" style="width:${voted ? pct : 0}%"></div><span class="relative">${esc(o)}</span>${voted ? `<span class="relative float-right text-sm">${bn(pct)}% (${bn(c)})</span>` : ''}</button>`;
        }).join('') + `<div class="text-xs text-gray-400">${voted ? 'আপনি ভোট দিয়েছেন · ' : ''}মোট ${bn(total)} ভোট</div>`;
    }
    return `<article id="post-${p.id}" class="p-4 border-b"><div class="flex justify-between text-xs text-gray-400 mb-2"><span>${esc(group.name)}</span><span>${ago(p.createdAt)}</span></div>${body}
    <div class="flex items-center gap-4 mt-3 text-sm text-gray-600"><button data-like="${p.id}">${liked ? '❤️' : '🤍'} ${bn((p.likes || []).length)}</button><span>👁️ ${bn(p.views || 0)}</span>${isAdmin ? `<button data-del="${p.id}" class="ml-auto text-red-500">🗑️ মুছুন</button>` : ''}</div></article>`;
}
// লাইক টগল
function toggleLike(id) {
    const p = posts.find(x => x.id === id), liked = (p.likes || []).includes(me.id);
    updateDoc(doc(db, 'posts', id), { likes: liked ? arrayRemove(me.id) : arrayUnion(me.id) });
}
// ভোট (ট্রানজেকশনে একবারই)
async function vote(pid, idx) {
    try {
        await runTransaction(db, async t => {
            const r = doc(db, 'posts', pid), s = await t.get(r), votes = s.data().votes || {};
            if (Object.values(votes).some(a => (a || []).includes(me.id))) throw new Error('dup');
            votes[idx] = [...(votes[idx] || []), me.id]; t.update(r, { votes });
        });
        toast('ভোট দেওয়া হয়েছে');
    } catch (e) { toast(e.message === 'dup' ? 'আপনি আগেই ভোট দিয়েছেন' : 'ভোট ব্যর্থ', true); }
}
// ভিউ কাউন্ট (একবারই)
const viewing = new Set();
function markViewed(p) {
    if ((p.viewedBy || []).includes(me.id) || viewing.has(p.id)) return;
    viewing.add(p.id);
    updateDoc(doc(db, 'posts', p.id), { views: increment(1), viewedBy: arrayUnion(me.id) }).catch(()=>{});
    updateDoc(doc(db, 'users', me.id), { viewedPosts: arrayUnion(p.id) }).catch(()=>{});
}
// ফুল স্ক্রিন ছবি/ভিডিও
function openFull(url, kind) {
    $('fc').innerHTML = kind === 'img' ? `<img src="${esc(url)}" class="max-h-screen w-full object-contain">` : `<video src="${esc(url)}" class="max-h-screen w-full" controls autoplay></video>`;
    $('full').classList.remove('hidden');
}

// ===== সদস্য =====
function renderMembers() {
    $('main').innerHTML = `<div class="p-4 font-semibold border-b">মোট সদস্য: ${bn(users.length)} জন</div>` + users.map(u => `
    <div class="flex items-center gap-3 p-3 border-b"><div class="w-10 h-10 rounded-full grad text-white flex items-center justify-center font-bold">${esc((u.name || '?')[0])}</div>
    <div class="flex-1 ${u.blocked ? 'text-red-600' : ''}">${esc(u.name)}${u.phone === ADMIN_PHONE ? ' <span class="text-xs text-indigo-500">(অ্যাডমিন)</span>' : ''}${u.blocked ? ' · ব্লকড' : ''}</div>
    ${isAdmin && u.phone !== ADMIN_PHONE ? `<button data-blk="${u.id}" class="text-xs px-3 py-1 rounded ${u.blocked ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">${u.blocked ? 'আনব্লক' : 'ব্লক'}</button>` : ''}</div>`).join('');
    $('main').querySelectorAll('[data-blk]').forEach(b => b.onclick = () => { const u = users.find(x => x.id === b.dataset.blk); updateDoc(doc(db, 'users', u.id), { blocked: !u.blocked }); toast(u.blocked ? 'আনব্লক করা হয়েছে' : 'ব্লক করা হয়েছে'); });
}

// ===== সাপোর্ট চ্যাট =====
function closeChat() { chatWith = null; }
function renderSupport() {
    if (isAdmin && !chatWith) { // অ্যাডমিন ইনবক্স
        const g = {}; allMsgs.forEach(m => { (g[m.userId] ||= []).push(m); });
        const rows = Object.entries(g).map(([uid, ms]) => { ms.sort((a, b) => (a.createdAt?.toMillis?.() || Infinity) - (b.createdAt?.toMillis?.() || Infinity)); return [uid, ms]; })
            .sort((a, b) => (b[1].at(-1).createdAt?.toMillis?.() || Infinity) - (a[1].at(-1).createdAt?.toMillis?.() || Infinity));
        $('main').innerHTML = `<div class="p-4 font-semibold border-b">📥 সাপোর্ট ইনবক্স</div>` + (rows.length ? rows.map(([uid, ms]) => {
            const unread = ms.filter(m => m.sender === 'user' && !m.seen).length, l = ms.at(-1);
            return `<div data-u="${uid}" class="flex items-center gap-3 p-3 border-b cursor-pointer"><div class="w-10 h-10 rounded-full grad text-white flex items-center justify-center">${esc((ms[0].userName || '?')[0])}</div><div class="flex-1 min-w-0"><div class="font-medium">${esc(ms.find(m => m.userName)?.userName || 'ইউজার')}</div><div class="text-sm text-gray-500 truncate">${esc(l.text)}</div></div>${unread ? `<span class="bg-indigo-600 text-white text-xs rounded-full px-2">${bn(unread)}</span>` : ''}</div>`;
        }).join('') : `<div class="text-center text-gray-400 pt-24">কোনো মেসেজ নেই</div>`);
        $('main').querySelectorAll('[data-u]').forEach(r => r.onclick = () => { chatWith = r.dataset.u; renderSupport(); });
        return;
    }
    const uid = isAdmin ? chatWith : me.id, name = isAdmin ? (users.find(u => u.id === uid)?.name || 'ইউজার') : 'অ্যাডমিন';
    const ms = allMsgs.filter(m => m.userId === uid).sort((a, b) => (a.createdAt?.toMillis?.() || Infinity) - (b.createdAt?.toMillis?.() || Infinity));
    const other = isAdmin ? 'user' : 'admin';
    ms.forEach(m => { if (m.sender === other && !m.seen) updateDoc(doc(db, 'supportMessages', m.id), { seen: true, delivered: true }).catch(()=>{}); });
    const keep = $('cmsg')?.scrollTop;
    $('main').innerHTML = `<div class="flex flex-col" style="height:calc(100vh - 140px)"><div class="p-3 border-b flex items-center gap-2">${isAdmin ? '<button id="bk">←</button>' : ''}<b>${esc(name)}</b></div>
    <div id="cmsg" class="flex-1 overflow-y-auto p-3 space-y-2 bg-[#eef0f7]">${ms.length ? ms.map(m => {
        const mine = m.sender === (isAdmin ? 'admin' : 'user');
        return `<div class="flex ${mine ? 'justify-end' : ''}"><div class="${mine ? 'bubble-me' : 'bubble-them'} px-3 py-2 max-w-[80%] shadow-sm"><div class="whitespace-pre-wrap">${esc(m.text)}</div><div class="text-[10px] text-gray-500 text-right">${clock(m.createdAt)} ${mine ? `<span class="${m.seen ? 'text-blue-500' : ''}">${m.delivered || m.seen ? '✔✔' : '✔'}</span>` : ''}</div></div></div>`;
    }).join('') : `<div class="text-center text-gray-400 pt-16">অ্যাডমিনকে মেসেজ পাঠান</div>`}</div>
    <div class="p-2 flex gap-2 border-t bg-white"><input id="ci" class="flex-1 border rounded-full px-4 py-2" placeholder="মেসেজ লিখুন..."><button id="cs" class="grad text-white rounded-full px-4">পাঠান</button></div></div>`;
    const box = $('cmsg'); box.scrollTop = box.scrollHeight;
    if ($('bk')) $('bk').onclick = () => { chatWith = null; renderSupport(); };
    const send = async () => {
        const t = $('ci').value.trim(); if (!t) return; $('ci').value = '';
        await addDoc(collection(db, 'supportMessages'), { userId: uid, userName: isAdmin ? name : me.name, text: t, sender: isAdmin ? 'admin' : 'user', seen: false, delivered: false, createdAt: serverTimestamp() });
    };
    $('cs').onclick = send; $('ci').onkeydown = e => e.key === 'Enter' && send();
}

// ===== প্রোফাইল =====
function renderProfile() {
    const d = me.joinedAt?.toDate ? me.joinedAt.toDate().toLocaleDateString('bn-BD') : 'আজ';
    $('main').innerHTML = `<div class="p-6 text-center"><div class="w-24 h-24 rounded-full grad text-white text-4xl flex items-center justify-center mx-auto mb-3">${esc(me.name[0])}</div><h2 class="text-xl font-bold">${esc(me.name)}</h2>
    <p class="text-indigo-600 mb-1">${isAdmin ? 'অ্যাডমিন' : 'সদস্য'}</p><p class="text-gray-500 text-sm mb-6">যোগ দিয়েছেন: ${d}</p>
    <button class="inst hidden w-full mb-3 border border-indigo-500 text-indigo-600 py-2 rounded-lg">📲 অ্যাপ ইনস্টল করুন</button>
    <button id="lo" class="w-full bg-red-500 text-white py-3 rounded-lg">লগআউট</button></div>`;
    $('lo').onclick = () => confirm('লগআউট করবেন?') && logout(); bindInstall();
}

// ===== অ্যাডমিন প্যানেল =====
function renderAdmin() {
    if (!isAdmin) return;
    $('main').innerHTML = `<div class="p-4 space-y-6">
    <section><h3 class="font-bold mb-2">🏷️ গ্রুপ সেটিংস</h3>
      <input id="gname" class="w-full border rounded-lg p-2 mb-2" placeholder="গ্রুপের নাম" value="${esc(group.name)}">
      <textarea id="gdesc" class="w-full border rounded-lg p-2 mb-2" placeholder="গ্রুপের বিবরণ">${esc(group.description)}</textarea>
      <input id="gimg" type="file" accept="image/*" class="mb-2 text-sm"><button id="gsave" class="w-full grad text-white py-2 rounded-lg">সেভ করুন</button></section>
    <section><h3 class="font-bold mb-2">✍️ নতুন পোস্ট</h3>
      <select id="ptype" class="w-full border rounded-lg p-2 mb-2"><option value="text">টেক্সট</option><option value="image">ছবি</option><option value="video">ভিডিও</option><option value="link">লিংক</option><option value="poll">পোল</option></select>
      <textarea id="ptext" class="w-full border rounded-lg p-2 mb-2" placeholder="লেখা / প্রশ্ন"></textarea>
      <div id="pfile" class="hidden mb-2"><input id="pf" type="file" class="text-sm"></div>
      <input id="plink" class="hidden w-full border rounded-lg p-2 mb-2" placeholder="https://...">
      <div id="ppoll" class="hidden mb-2"><div id="popts"></div><button id="padd" class="text-indigo-600 text-sm">➕ অপশন যোগ করুন</button></div>
      <button id="pgo" class="w-full grad text-white py-2 rounded-lg">পোস্ট করুন</button></section>
    <section><h3 class="font-bold mb-2">👥 সদস্য ব্যবস্থাপনা (মোট ${bn(users.length)})</h3>
      ${users.filter(u => u.phone !== ADMIN_PHONE).map(u => `<div class="flex justify-between items-center py-1 ${u.blocked ? 'text-red-600' : ''}"><span>${esc(u.name)}</span><button data-blk="${u.id}" class="text-xs px-3 py-1 rounded ${u.blocked ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">${u.blocked ? 'আনব্লক' : 'ব্লক'}</button></div>`).join('') || '<p class="text-gray-400 text-sm">কোনো সদস্য নেই</p>'}</section>
    <section><h3 class="font-bold mb-2">🔄 নতুন ব্যাচ</h3><button id="nb" class="w-full bg-red-500 text-white py-2 rounded-lg">নতুন ব্যাচ শুরু করুন</button><p class="text-xs text-gray-500 mt-1">পুরনো সব সদস্য ব্লক হবে। সাপোর্ট ইনবক্স দেখতে "সাপোর্ট" ট্যাবে যান।</p></section></div>`;
    $('main').querySelectorAll('[data-blk]').forEach(b => b.onclick = () => { const u = users.find(x => x.id === b.dataset.blk); updateDoc(doc(db, 'users', u.id), { blocked: !u.blocked }); });
    $('gsave').onclick = saveGroup; $('pgo').onclick = createPost; $('nb').onclick = newBatch;
    $('padd').onclick = () => { pollOpts++; drawOpts(); };
    $('ptype').onchange = e => { postType = e.target.value; typeUI(); }; $('ptype').value = postType; typeUI(); drawOpts();
}
// টাইপ অনুযায়ী ফিল্ড দেখানো/লুকানো
function typeUI() {
    $('pfile').classList.toggle('hidden', !['image', 'video'].includes(postType));
    $('pf').accept = postType === 'image' ? 'image/*' : 'video/*';
    $('plink').classList.toggle('hidden', postType !== 'link'); $('ppoll').classList.toggle('hidden', postType !== 'poll');
}
function drawOpts() { $('popts').innerHTML = Array.from({ length: pollOpts }, (_, i) => `<input class="po w-full border rounded-lg p-2 mb-1" placeholder="অপশন ${bn(i + 1)}">`).join(''); }
// গ্রুপ সেটিংস সেভ
async function saveGroup() {
    try {
        const data = { name: $('gname').value.trim() || 'কমিউনিটি', description: $('gdesc').value.trim(), imageUrl: group.imageUrl || '', updatedAt: serverTimestamp() };
        const f = $('gimg').files[0]; if (f) { toast('ছবি আপলোড হচ্ছে...'); data.imageUrl = await upload(f, 'group'); }
        await setDoc(doc(db, 'settings', 'group'), data); toast('সেভ হয়েছে ✅');
    } catch (e) { toast('সেভ ব্যর্থ', true); }
}
// পোস্ট তৈরি + পুশ
async function createPost() {
    const text = $('ptext').value.trim(), p = { type: postType, text, likes: [], votes: {}, views: 0, viewedBy: [], createdAt: serverTimestamp(), batchId };
    try {
        if (postType === 'text' && !text) return toast('কিছু লিখুন', true);
        if (['image', 'video'].includes(postType)) {
            const f = $('pf').files[0]; if (!f) return toast('ফাইল নির্বাচন করুন', true);
            toast('আপলোড হচ্ছে...'); p[postType === 'image' ? 'imageUrl' : 'videoUrl'] = await upload(f, 'posts');
        }
        if (postType === 'link') { p.linkUrl = $('plink').value.trim(); if (!/^https?:\/\//.test(p.linkUrl)) return toast('সঠিক লিংক দিন', true); }
        if (postType === 'poll') { p.options = [...document.querySelectorAll('.po')].map(i => i.value.trim()).filter(Boolean); if (p.options.length < 2 || !text) return toast('প্রশ্ন ও কমপক্ষে ২টি অপশন দিন', true); }
        const r = await addDoc(collection(db, 'posts'), p);
        sendOneSignalPush(group.name, text || 'নতুন পোস্ট এসেছে', r.id);
        toast('পোস্ট হয়েছে ✅'); pollOpts = 2; postType = 'text'; tab = 'home'; render();
    } catch (e) { toast('পোস্ট ব্যর্থ', true); }
}
// নতুন ব্যাচ: পুরনো সবাই ব্লক
async function newBatch() {
    if (!confirm('নতুন ব্যাচ শুরু করলে পুরনো সব সদস্য ব্লক হবে। নিশ্চিত?')) return;
    try {
        const nb = 'b' + Date.now(), b = writeBatch(db);
        users.filter(u => u.phone !== ADMIN_PHONE).forEach(u => b.update(doc(db, 'users', u.id), { blocked: true }));
        b.set(doc(db, 'settings', 'currentBatch'), { batchId: nb, startedAt: serverTimestamp() });
        await b.commit(); batchId = nb; toast('নতুন ব্যাচ শুরু হয়েছে ✅');
    } catch (e) { toast('ব্যর্থ হয়েছে', true); }
}

// ===== PWA ইনস্টল =====
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; bindInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; document.querySelectorAll('.inst').forEach(b => b.classList.add('hidden')); });
// ইনস্টল বাটন বাইন্ড (ইনস্টল না হলেই দেখাবে)
function bindInstall() {
    document.querySelectorAll('.inst').forEach(b => {
        b.classList.toggle('hidden', isStandalone() || !(deferredPrompt || isIOS));
        b.onclick = async () => {
            if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; bindInstall(); }
            else if (isIOS) alert('iPhone-এ ইনস্টল করতে: Safari-র Share বাটন চাপুন → "Add to Home Screen" নির্বাচন করুন।');
        };
    });
}
boot();
</script>
</body>
</html>
