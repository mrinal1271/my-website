 body{font-family:'Segoe UI',system-ui,sans-serif;background:#f3f4f8;overscroll-behavior:none}

 @keyframes hl{50%{box-shadow:0 0 0 4px #a78bfa}}

<body>
<div id="toasts" class="fixed top-3 right-3 z-[100] space-y-2"></div>
<div id="app" class="max-w-xl mx-auto min-h-screen bg-white relative"><div class="pt-40"><div class="spin"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp, arrayUnion, arrayRemove, increment, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// কনফিগারেশন
const firebaseConfig = { projectId:"group-app-ab54f", authDomain:"group-app-ab54f.firebaseapp.com", storageBucket:"group-app-ab54f.firebasestorage.app", messagingSenderId:"1014775593877", appId:"1:1014775593877:web:f88fa6cd7b812a7ab3549c", measurementId:"G-WNE7ZNZK46" };
const ADMIN_PHONE = "01866989184";
const OS_APP_ID = "6f039946-596a-4750-a70e-3eac2f827f6c";
const OS_REST_KEY = "os_v2_app_n4bzsrsznjdvbjyoh2wc7at7nqlfqna6t7be3kewtiulwjm6yplndusra3wqdspauw5z2jxf4ogwu5pt7texehzagjmvc5obsgys6gi";
const SITE = "https://mrinal1271.github.io/my-website/";
const db = getFirestore(initializeApp(firebaseConfig));
const storage = getStorage();

let me = null, isAdmin = false, tab = 'home', batchId = null;
let posts = [], users = [], group = { name:'কমিউনিটি', description:'', imageUrl:'' };
let firstPostLoad = true, chatWith = null, allMsgs = [], deferredPrompt = null, pollOpts = 2, postType = 'text';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

function ago(ts) {
    if (!ts?.toMillis) return 'এইমাত্র';
    const s = (Date.now() - ts.toMillis()) / 1000;
    if (s < 60) return 'এইমাত্র';
    if (s < 3600) return bn(Math.floor(s/60)) + ' মিনিট আগে';
    if (s < 86400) return bn(Math.floor(s/3600)) + ' ঘন্টা আগে';
    return ts.toDate().toLocaleDateString('bn-BD');
}
const clock = ts => ts?.toDate ? ts.toDate().toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'}) : '';

function toast(msg, err) {
    const d = document.createElement('div');
    d.className = `px-4 py-2 rounded-lg shadow-lg text-white text-sm ${err ? 'bg-red-500' : 'bg-indigo-600'}`;
    d.textContent = msg; $('toasts').appendChild(d); setTimeout(() => d.remove(), 3500);
}

function playNotificationSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
        setTimeout(() => { try { ctx.close(); } catch(e){} }, 1000);
    } catch (e) {}
}

async function sendOneSignalPush(title, message, postId) {
    try {
        const payload = { app_id: OS_APP_ID, included_segments: ["Subscribed Users"], headings: { en: title }, contents: { en: message }, url: postId ? `${SITE}?post=${postId}` : SITE };
        await fetch("https://onesignal.com/api/v1/notifications", { method:"POST", headers:{ "Content-Type":"application/json; charset=utf-8", "Authorization":"Basic " + OS_REST_KEY }, body: JSON.stringify(payload) });
    } catch (e) { console.error(e); }
}

async function upload(file, folder) {
    try {
        const r = ref(storage, `${folder}/${Date.now()}_${file.name}`);
        await uploadBytes(r, file); return await getDownloadURL(r);
    } catch (e) {
        toast('ফাইল আপলোড ব্যর্থ হয়েছে! Storage Rules চেক করুন।', true);
        throw e;
    }
}

async function loadBatch() {
    const r = doc(db, 'settings', 'currentBatch'), s = await getDoc(r);
    if (s.exists()) batchId = s.data().batchId;
    else { batchId = 'b' + Date.now(); await setDoc(r, { batchId, startedAt: serverTimestamp() }); }
}

async function boot() {
    await loadBatch();
    const id = localStorage.getItem('cp_uid');
    if (id) {
        const s = await getDoc(doc(db, 'users', id));
        if (s.exists()) return enter({ id, ...s.data() });
        localStorage.removeItem('cp_uid');
    }
    showAuth();
}

function enter(u) {
    isAdmin = u.phone === ADMIN_PHONE;
    if (u.blocked && !isAdmin) return showBlocked();
    me = u; localStorage.setItem('cp_uid', u.id);
    updateDoc(doc(db, 'users', u.id), { lastSeen: serverTimestamp() }).catch(()=>{});
    renderShell(); startListeners();
}

function showBlocked() {
    $('app').innerHTML = `<div class="p-10 pt-32 text-center"><div class="text-5xl mb-4">🚫</div><h2 class="text-xl font-bold mb-2">আপনার অ্যাক্সেস বন্ধ</h2><p class="text-gray-500 mb-6">অ্যাডমিন আপনাকে ব্লক করেছেন।</p><button id="lo" class="px-5 py-2 grad text-white rounded-lg">লগআউট</button></div>`;
    $('lo').onclick = logout;
}

function logout() { localStorage.removeItem('cp_uid'); location.reload(); }

function showAuth() {
    $('app').innerHTML = `<div class="grad min-h-screen flex items-center p-6"><div class="bg-white rounded-2xl p-6 w-full shadow-xl">
    <div class="text-center text-4xl mb-2">💬</div><h1 class="text-xl font-bold text-center mb-1">কমিউনিটিতে স্বাগতম</h1><p class="text-center text-gray-500 text-sm mb-5">যোগ দিতে তথ্য দিন</p>
    <input id="rn" class="w-full border rounded-lg p-3 mb-3" placeholder="আপনার নাম *">
    <input id="rp" type="tel" class="w-full border rounded-lg p-3 mb-3" placeholder="ফোন নম্বর *">
    <input id="rg" type="email" class="w-full border rounded-lg p-3 mb-4" placeholder="জিমেইল (ঐচ্ছিক)">
    <button id="rb" class="w-full grad text-white py-3 rounded-lg font-semibold">যোগ দিন</button></div></div>`;
    $('rb').onclick = register;
}

async function register() {
    const name = $('rn').value.trim(), phone = $('rp').value.trim().replace(/\s/g,''), gmail = $('rg').value.trim();
    if (!name || !phone) return toast('নাম ও ফোন নম্বর আবশ্যক', true);
    if (!/^01\d{9}$/.test(phone)) return toast('সঠিক ১১ ডিজিটের ফোন নম্বর দিন', true);
    
    let perm = Notification.permission;
    if (perm !== 'granted') {
        const m = document.createElement('div');
        m.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6';
        m.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center max-w-sm"><div class="text-5xl mb-3">🔔</div><p class="font-semibold mb-5">আপডেট পেতে নোটিফিকেশন এলাও করুন</p><button id="al" class="w-full grad text-white py-3 rounded-lg font-semibold">✅ এলাও করুন</button><button id="sk" class="w-full mt-2 text-gray-500">স্কিপ করুন</button></div>`;
        document.body.appendChild(m);
        
        $('al').onclick = async () => {
            try { perm = await Notification.requestPermission(); } catch (e) {}
            if (perm !== 'granted') toast('নোটিফিকেশন অফ করা আছে, তবে আপনি ব্যবহার করতে পারবেন।');
            m.remove(); await saveUser(name, phone, gmail);
        };
        $('sk').onclick = async () => { m.remove(); await saveUser(name, phone, gmail); };
    } else {
        await saveUser(name, phone, gmail);
    }
}

async function saveUser(name, phone, gmail) {
    try {
        const q = await getDocs(query(collection(db, 'users'), where('phone', '==', phone)));
        if (!q.empty) { const d = q.docs[0]; return enter({ id: d.id, ...d.data() }); }
        const data = { name, phone, gmail, batchId, blocked: false, joinedAt: serverTimestamp(), lastSeen: serverTimestamp(), viewedPosts: [] };
        const r = await addDoc(collection(db, 'users'), data);
        enter({ id: r.id, ...data, joinedAt: null });
    } catch (e) { toast('সমস্যা হয়েছে, আবার চেষ্টা করুন', true); }
}

function renderShell() {
    const tabs = [['home','🏠','হোম'],['members','👥','সদস্য'],['support','💬','সাপোর্ট'],['profile','👤','প্রোফাইল']];
    if (isAdmin) tabs.push(['admin','⚙️','প্যানেল']);
    $('app').innerHTML = `
    <header class="grad text-white p-3 flex items-center gap-3 sticky top-0 z-30">
      <img id="gi" class="w-10 h-10 rounded-full bg-white/30 object-cover" alt="">
      <div class="flex-1 min-w-0"><div id="gn" class="font-bold truncate"></div><div id="gd" class="text-xs opacity-80 truncate"></div></div>
      <button class="inst hidden text-xs bg-white/20 px-2 py-1 rounded">📲 ইনস্টল</button>
    </header>
    <main id="main" class="pb-20"></main>
    <nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white border-t flex z-30 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
      ${tabs.map(t => `<button data-t="${t[0]}" class="nb flex-1 py-2 text-xs transition-colors"><div class="text-xl mb-1">${t[1]}</div>${t[2]}</button>`).join('')}
    </nav>
    <div id="full" class="hidden fixed inset-0 bg-black/90 z-[90] flex items-center justify-center"><button id="fx" class="absolute top-4 right-4 text-white text-3xl z-50">✕</button><div id="fc" class="w-full"></div></div>`;
    document.querySelectorAll('.nb').forEach(b => b.onclick = () => { tab = b.dataset.t; if (tab !== 'support') chatWith = null; render(); });
    $('fx').onclick = () => { $('full').classList.add('hidden'); $('fc').innerHTML = ''; };
    bindInstall(); renderHeader(); render();
}

function renderHeader() {
    if (!$('gn')) return;
    $('gn').textContent = group.name; $('gd').textContent = group.description;
    $('gi').src = group.imageUrl || 'icon-192.png';
}

function render() {
    if (!$('main')) return;
    document.querySelectorAll('.nb').forEach(b => {
        b.classList.toggle('text-indigo-600', b.dataset.t === tab);
        b.classList.toggle('font-bold', b.dataset.t === tab);
        b.classList.toggle('text-gray-500', b.dataset.t !== tab);
    });
    ({ home: renderHome, members: renderMembers, support: renderSupport, profile: renderProfile, admin: renderAdmin }[tab])();
}

function startListeners() {
    onSnapshot(doc(db, 'settings', 'group'), s => { if (s.exists()) group = { ...group, ...s.data() }; renderHeader(); });
    onSnapshot(doc(db, 'users', me.id), s => { if (s.exists() && s.data().blocked && !isAdmin) showBlocked(); });
    onSnapshot(query(collection(db, 'users'), orderBy('joinedAt', 'desc')), s => {
        users = s.docs.map(d => ({ id: d.id, ...d.data() })); if (tab === 'members' || tab === 'admin') render();
    });
    onSnapshot(query(collection(db, 'posts'), orderBy('createdAt', 'desc')), s => {
        posts = s.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!firstPostLoad) s.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) newPostAlert(c.doc.data()); });
        firstPostLoad = false; if (tab === 'home') { renderHome(); handleDeepLink(); }
    });
    onSnapshot(collection(db, 'supportMessages'), s => {
        allMsgs = s.docs.map(d => ({ id: d.id, ...d.data() }));
        if (tab === 'support') renderSupport();
    });
}

function newPostAlert(p) {
    playNotificationSound(); toast('📢 নতুন পোস্ট এসেছে');
}

let deepDone = false;
function handleDeepLink() {
    const id = new URLSearchParams(location.search).get('post');
    if (!id || deepDone) return;
    const el = $('post-' + id); if (!el) return;
    deepDone = true; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('hl');
}

function renderHome() {
    const m = $('main');
    if (!posts.length) { m.innerHTML = `<div class="text-center text-gray-400 pt-32"><div class="text-5xl mb-2">📭</div>এখনো কোনো পোস্ট নেই</div>`; return; }
    m.innerHTML = posts.map(postHTML).join('');
    
    // Listeners for Post Actions
    m.querySelectorAll('[data-like]').forEach(b => b.onclick = () => toggleLike(b.dataset.like));
    m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('পোস্টটি মুছে ফেলবেন?') && deleteDoc(doc(db, 'posts', b.dataset.del)));
    m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
        const newText = prompt('পোস্ট এডিট করুন:', b.dataset.text);
        if (newText !== null) updateDoc(doc(db, 'posts', b.dataset.edit), { text: newText });
    });
    m.querySelectorAll('[data-share]').forEach(b => b.onclick = async () => {
        const url = `${SITE}?post=${b.dataset.share}`;
        if (navigator.share) { try { await navigator.share({ title: group.name, url }); } catch(e){} } 
        else { navigator.clipboard.writeText(url); toast('লিংক কপি হয়েছে!'); }
    });
    m.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => vote(b.dataset.pid, b.dataset.vote));
    m.querySelectorAll('[data-full]').forEach(b => b.onclick = () => openFull(b.dataset.full, b.dataset.kind));
    posts.forEach(markViewed); handleDeepLink();
}

function postHTML(p) {
    const liked = (p.likes || []).includes(me.id), voted = Object.values(p.votes || {}).some(a => (a || []).includes(me.id));
    let body = p.text ? `<p class="whitespace-pre-wrap mb-2">${esc(p.text)}</p>` : '';
    if (p.type === 'image') body += `<img src="${esc(p.imageUrl)}" data-full="${esc(p.imageUrl)}" data-kind="img" class="rounded-lg w-full cursor-pointer mt-2">`;
    if (p.type === 'video') body += `<video src="${esc(p.videoUrl)}" data-full="${esc(p.videoUrl)}" data-kind="vid" class="rounded-lg w-full mt-2" controls></video>`;
    if (p.type === 'link') body += `<a href="${esc(p.linkUrl)}" target="_blank" rel="noopener" class="text-indigo-600 underline break-all mt-2 block">🔗 ${esc(p.linkUrl)}</a>`;
    if (p.type === 'poll') {
        const total = Object.values(p.votes || {}).reduce((a, v) => a + (v || []).length, 0);
        body += (p.options || []).map((o, i) => {
            const c = (p.votes?.[i] || []).length, pct = total ? Math.round(c / total * 100) : 0;
            return `<button ${voted ? 'disabled' : ''} data-pid="${p.id}" data-vote="${i}" class="relative block w-full text-left border rounded-lg p-2 mb-1 overflow-hidden mt-2"><div class="absolute inset-y-0 left-0 bg-indigo-100" style="width:${voted ? pct : 0}%"></div><span class="relative">${esc(o)}</span>${voted ? `<span class="relative float-right text-sm">${bn(pct)}%</span>` : ''}</button>`;
        }).join('') + `<div class="text-xs text-gray-400 mt-1">${voted ? 'আপনি ভোট দিয়েছেন · ' : ''}মোট ${bn(total)} ভোট</div>`;
    }
    
    let adminOpts = isAdmin ? `<button data-edit="${p.id}" data-text="${esc(p.text || '')}" class="text-indigo-500 mr-3">✏️ এডিট</button><button data-del="${p.id}" class="text-red-500">🗑️ মুছুন</button>` : '';
    
    return `<article id="post-${p.id}" class="p-4 border-b bg-white"><div class="flex justify-between text-xs text-gray-400 mb-2"><span>${esc(group.name)}</span><span>${ago(p.createdAt)}</span></div>${body}
    <div class="flex items-center mt-4 text-sm text-gray-600">
        <button data-like="${p.id}" class="mr-4">${liked ? '❤️' : '🤍'} ${bn((p.likes || []).length)}</button>
        <span class="mr-4">👁️ ${bn(p.views || 0)}</span>
        <button data-share="${p.id}" class="text-blue-500 mr-auto">🔗 শেয়ার</button>
        ${adminOpts}
    </div></article>`;
}

function toggleLike(id) {
    const p = posts.find(x => x.id === id), liked = (p.likes || []).includes(me.id);
    updateDoc(doc(db, 'posts', id), { likes: liked ? arrayRemove(me.id) : arrayUnion(me.id) });
}

async function vote(pid, idx) {
    try {
        await runTransaction(db, async t => {
            const r = doc(db, 'posts', pid), s = await t.get(r), votes = s.data().votes || {};
            if (Object.values(votes).some(a => (a || []).includes(me.id))) throw new Error('dup');
            votes[idx] = [...(votes[idx] || []), me.id]; t.update(r, { votes });
        });
    } catch (e) { toast(e.message === 'dup' ? 'আপনি আগেই ভোট দিয়েছেন' : 'ভোট ব্যর্থ', true); }
}

const viewing = new Set();
function markViewed(p) {
    if ((p.viewedBy || []).includes(me.id) || viewing.has(p.id)) return;
    viewing.add(p.id);
    updateDoc(doc(db, 'posts', p.id), { views: increment(1), viewedBy: arrayUnion(me.id) }).catch(()=>{});
}

function openFull(url, kind) {
    $('fc').innerHTML = kind === 'img' ? `<img src="${esc(url)}" class="max-h-screen w-full object-contain">` : `<video src="${esc(url)}" class="max-h-screen w-full" controls autoplay></video>`;
    $('full').classList.remove('hidden');
}

function renderMembers() {
    $('main').innerHTML = `<div class="p-4 font-semibold border-b bg-gray-50">মোট সদস্য: ${bn(users.length)} জন</div>` + users.map(u => `
    <div class="flex items-center gap-3 p-3 border-b"><div class="w-10 h-10 rounded-full grad text-white flex items-center justify-center font-bold text-lg">${esc((u.name || '?')[0])}</div>
    <div class="flex-1 ${u.blocked ? 'text-red-600' : ''}"><div class="font-medium">${esc(u.name)}${u.phone === ADMIN_PHONE ? ' <span class="text-xs text-indigo-500 bg-indigo-100 px-1 rounded">অ্যাডমিন</span>' : ''}</div>
    <div class="text-xs text-gray-500">${u.blocked ? 'ব্লক করা হয়েছে' : 'সদস্য'}</div></div>
    </div>`).join('');
}

function renderSupport() {
    if (isAdmin && !chatWith) { 
        const g = {}; allMsgs.forEach(m => { (g[m.userId] ||= []).push(m); });
        const rows = Object.entries(g).map(([uid, ms]) => { ms.sort((a, b) => (a.createdAt?.toMillis?.() || Infinity) - (b.createdAt?.toMillis?.() || Infinity)); return [uid, ms]; })
            .sort((a, b) => (b[1].at(-1).createdAt?.toMillis?.() || Infinity) - (a[1].at(-1).createdAt?.toMillis?.() || Infinity));
        
        $('main').innerHTML = `<div class="p-4 font-semibold border-b bg-gray-50">📥 সাপোর্ট ইনবক্স</div>` + (rows.length ? rows.map(([uid, ms]) => {
            const unread = ms.filter(m => m.sender === 'user' && !m.seen).length, l = ms.at(-1);
            return `<div data-u="${uid}" class="flex items-center gap-3 p-3 border-b cursor-pointer hover:bg-gray-50"><div class="w-10 h-10 rounded-full grad text-white flex items-center justify-center font-bold">${esc((ms[0].userName || '?')[0])}</div><div class="flex-1 min-w-0"><div class="font-medium">${esc(ms.find(m => m.userName)?.userName || 'ইউজার')}</div><div class="text-sm text-gray-500 truncate">${esc(l.text)}</div></div>${unread ? `<span class="bg-indigo-600 text-white text-xs rounded-full px-2 py-0.5">${bn(unread)}</span>` : ''}</div>`;
        }).join('') : `<div class="text-center text-gray-400 pt-24">কোনো মেসেজ নেই</div>`);
        $('main').querySelectorAll('[data-u]').forEach(r => r.onclick = () => { chatWith = r.dataset.u; renderSupport(); });
        return;
    }
    
    const uid = isAdmin ? chatWith : me.id, name = isAdmin ? (users.find(u => u.id === uid)?.name || 'ইউজার') : 'অ্যাডমিন';
    const ms = allMsgs.filter(m => m.userId === uid).sort((a, b) => (a.createdAt?.toMillis?.() || Infinity) - (b.createdAt?.toMillis?.() || Infinity));
    const other = isAdmin ? 'user' : 'admin';
    ms.forEach(m => { if (m.sender === other && !m.seen) updateDoc(doc(db, 'supportMessages', m.id), { seen: true }).catch(()=>{}); });
    
    $('main').innerHTML = `<div class="flex flex-col" style="height:calc(100vh - 140px)">
    <div class="p-3 border-b flex items-center gap-3 bg-white sticky top-0 z-10 shadow-sm">${isAdmin ? '<button id="bk" class="p-1 text-lg">⬅️</button>' : ''}<b class="text-lg">${esc(name)}</b></div>
    <div id="cmsg" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#eef0f7]">${ms.length ? ms.map(m => {
        const mine = m.sender === (isAdmin ? 'admin' : 'user');
        return `<div class="flex ${mine ? 'justify-end' : ''}"><div class="${mine ? 'bubble-me' : 'bubble-them'} px-4 py-2 max-w-[80%] shadow-sm"><div class="whitespace-pre-wrap">${esc(m.text)}</div><div class="text-[10px] text-gray-500 text-right mt-1">${clock(m.createdAt)} ${mine ? `<span class="${m.seen ? 'text-blue-500' : ''}">✔</span>` : ''}</div></div></div>`;
    }).join('') : `<div class="text-center text-gray-400 pt-16">মেসেজ লিখে পাঠানো শুরু করুন</div>`}</div>
    <div class="p-3 flex gap-2 border-t bg-white"><input id="ci" class="flex-1 border border-gray-300 focus:outline-none focus:border-indigo-500 rounded-full px-4 py-2" placeholder="মেসেজ লিখুন..."><button id="cs" class="grad text-white rounded-full px-5 font-medium shadow-md">পাঠান</button></div></div>`;
    
    const box = $('cmsg'); box.scrollTop = box.scrollHeight;
    if ($('bk')) $('bk').onclick = () => { chatWith = null; renderSupport(); };
    
    const send = async () => {
        const t = $('ci').value.trim(); if (!t) return; $('ci').value = '';
        await addDoc(collection(db, 'supportMessages'), { userId: uid, userName: isAdmin ? name : me.name, text: t, sender: isAdmin ? 'admin' : 'user', seen: false, createdAt: serverTimestamp() });
        box.scrollTop = box.scrollHeight;
    };
    $('cs').onclick = send; $('ci').onkeydown = e => e.key === 'Enter' && send();
}

function renderProfile() {
    const d = me.joinedAt?.toDate ? me.joinedAt.toDate().toLocaleDateString('bn-BD') : 'আজ';
    $('main').innerHTML = `<div class="p-6 text-center"><div class="w-24 h-24 rounded-full grad text-white text-4xl flex items-center justify-center mx-auto mb-3 shadow-md">${esc(me.name[0])}</div><h2 class="text-xl font-bold">${esc(me.name)}</h2>
    <p class="text-indigo-600 mb-1 font-medium">${isAdmin ? 'অ্যাডমিন প্যানেল' : 'সাধারণ সদস্য'}</p><p class="text-gray-500 text-sm mb-6">যোগ দিয়েছেন: ${bn(d)}</p>
    <button class="inst hidden w-full mb-3 border-2 border-indigo-500 text-indigo-600 py-2.5 rounded-lg font-medium">📲 অ্যাপটি ইনস্টল করুন</button>
    <button id="lo" class="w-full bg-red-50 text-red-600 border border-red-200 py-3 rounded-lg font-medium">লগআউট করুন</button></div>`;
    $('lo').onclick = () => confirm('লগআউট করবেন?') && logout(); bindInstall();
}

function renderAdmin() {
    if (!isAdmin) return;
    $('main').innerHTML = `<div class="p-4 space-y-6 bg-gray-50 min-h-screen">
    <section class="bg-white p-4 rounded-xl shadow-sm"><h3 class="font-bold mb-3 text-lg border-b pb-2">🏷️ গ্রুপ সেটিংস</h3>
      <input id="gname" class="w-full border rounded-lg p-2.5 mb-3" placeholder="গ্রুপের নাম" value="${esc(group.name)}">
      <textarea id="gdesc" class="w-full border rounded-lg p-2.5 mb-3" placeholder="গ্রুপের বিবরণ">${esc(group.description)}</textarea>
      <input id="gimg" type="file" accept="image/*" class="mb-3 w-full text-sm"><button id="gsave" class="w-full grad text-white py-2.5 rounded-lg font-medium shadow">সেভ করুন</button></section>
    
    <section class="bg-white p-4 rounded-xl shadow-sm"><h3 class="font-bold mb-3 text-lg border-b pb-2">✍️ নতুন পোস্ট তৈরি</h3>
      <select id="ptype" class="w-full border rounded-lg p-2.5 mb-3"><option value="text">শুধুমাত্র টেক্সট</option><option value="image">ছবি সহ পোস্ট</option><option value="video">ভিডিও সহ পোস্ট</option><option value="link">লিংক শেয়ার</option><option value="poll">পোল / ভোটিং</option></select>
      <textarea id="ptext" class="w-full border rounded-lg p-2.5 mb-3" placeholder="এখানে কিছু লিখুন..."></textarea>
      <div id="pfile" class="hidden mb-3"><input id="pf" type="file" class="w-full text-sm"></div>
      <input id="plink" class="hidden w-full border rounded-lg p-2.5 mb-3" placeholder="https://...">
      <div id="ppoll" class="hidden mb-3"><div id="popts"></div><button id="padd" class="text-indigo-600 text-sm font-medium mt-2">➕ আরো অপশন যোগ করুন</button></div>
      <button id="pgo" class="w-full grad text-white py-2.5 rounded-lg font-medium shadow">পোস্ট পাবলিশ করুন</button></section>
    
    <section class="bg-white p-4 rounded-xl shadow-sm"><h3 class="font-bold mb-3 text-lg border-b pb-2">👥 সদস্য ব্যবস্থাপনা (মোট ${bn(users.length)})</h3>
      <div class="space-y-2">
      ${users.filter(u => u.phone !== ADMIN_PHONE).map(u => `
        <div class="flex flex-col py-2 border-b ${u.blocked ? 'opacity-50' : ''}">
            <div class="flex justify-between items-center mb-1">
                <span class="font-medium">${esc(u.name)}</span>
                <span class="text-xs text-gray-500 font-mono">${esc(u.phone)}</span>
            </div>
            <div class="flex justify-end gap-2">
                <button data-msg="${u.id}" class="text-xs px-3 py-1.5 rounded-md bg-blue-50 text-blue-600 border border-blue-200">মেসেজ</button>
                <button data-blk="${u.id}" class="text-xs px-3 py-1.5 rounded-md ${u.blocked ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-red-50 text-red-600 border border-red-200'}">${u.blocked ? 'আনব্লক করুন' : 'ব্লক করুন'}</button>
            </div>
        </div>
      `).join('') || '<p class="text-gray-400 text-sm py-2">কোনো সদস্য নেই</p>'}</div></section>
    </div>`;
    
    $('main').querySelectorAll('[data-blk]').forEach(b => b.onclick = () => { const u = users.find(x => x.id === b.dataset.blk); updateDoc(doc(db, 'users', u.id), { blocked: !u.blocked }); });
    $('main').querySelectorAll('[data-msg]').forEach(b => b.onclick = () => { tab = 'support'; chatWith = b.dataset.msg; render(); });
    
    $('gsave').onclick = saveGroup; 
    $('pgo').onclick = createPost;
    $('padd').onclick = () => { pollOpts++; drawOpts(); };
    $('ptype').onchange = e => { postType = e.target.value; typeUI(); }; 
    $('ptype').value = postType; typeUI(); drawOpts();
}

function typeUI() {
    $('pfile').classList.toggle('hidden', !['image', 'video'].includes(postType));
    $('pf').accept = postType === 'image' ? 'image/*' : 'video/*';
    $('plink').classList.toggle('hidden', postType !== 'link'); 
    $('ppoll').classList.toggle('hidden', postType !== 'poll');
}
function drawOpts() { $('popts').innerHTML = Array.from({ length: pollOpts }, (_, i) => `<input class="po w-full border rounded-lg p-2.5 mb-2 bg-gray-50" placeholder="অপশন ${bn(i + 1)}">`).join(''); }

async function saveGroup() {
    try {
        const btn = $('gsave'); btn.disabled = true; btn.innerText = 'সেভ হচ্ছে...';
        const data = { name: $('gname').value.trim() || 'কমিউনিটি', description: $('gdesc').value.trim(), imageUrl: group.imageUrl || '', updatedAt: serverTimestamp() };
        const f = $('gimg').files[0]; if (f) { toast('ছবি আপলোড হচ্ছে...'); data.imageUrl = await upload(f, 'group'); }
        await setDoc(doc(db, 'settings', 'group'), data); toast('সেভ হয়েছে ✅');
        btn.disabled = false; btn.innerText = 'সেভ করুন';
    } catch (e) { toast('সেভ ব্যর্থ', true); $('gsave').disabled = false; $('gsave').innerText = 'সেভ করুন'; }
}

async function createPost() {
    const btn = $('pgo');
    const text = $('ptext').value.trim(), p = { type: postType, text, likes: [], votes: {}, views: 0, viewedBy: [], createdAt: serverTimestamp(), batchId };
    try {
        if (postType === 'text' && !text) return toast('কিছু লিখুন', true);
        btn.disabled = true; btn.innerText = 'পোস্ট হচ্ছে... தயவுசெய்து অপেক্ষা করুন';
        
        if (['image', 'video'].includes(postType)) {
            const f = $('pf').files[0]; if (!f) { btn.disabled = false; btn.innerText = 'পোস্ট পাবলিশ করুন'; return toast('ফাইল নির্বাচন করুন', true); }
            toast('মিডিয়া আপলোড হচ্ছে...'); 
            p[postType === 'image' ? 'imageUrl' : 'videoUrl'] = await upload(f, 'posts');
        }
        if (postType === 'link') { p.linkUrl = $('plink').value.trim(); if (!/^https?:\/\//.test(p.linkUrl)) { btn.disabled = false; btn.innerText = 'পোস্ট পাবলিশ করুন'; return toast('সঠিক লিংক দিন', true); } }
        if (postType === 'poll') { p.options = [...document.querySelectorAll('.po')].map(i => i.value.trim()).filter(Boolean); if (p.options.length < 2 || !text) { btn.disabled = false; btn.innerText = 'পোস্ট পাবলিশ করুন'; return toast('প্রশ্ন ও কমপক্ষে ২টি অপশন দিন', true); } }
        
        const r = await addDoc(collection(db, 'posts'), p);
        sendOneSignalPush(group.name, text || (postType === 'image' ? 'নতুন একটি ছবি পোস্ট করা হয়েছে' : 'নতুন পোস্ট এসেছে'), r.id);
        
        toast('পোস্ট হয়েছে ✅'); 
        pollOpts = 2; postType = 'text'; tab = 'home'; render();
    } catch (e) { 
        toast('পোস্ট ব্যর্থ হয়েছে! ইন্টারনেট বা স্টোরেজ পারমিশন চেক করুন।', true); 
        btn.disabled = false; btn.innerText = 'পোস্ট পাবলিশ করুন';
    }
}

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; bindInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; document.querySelectorAll('.inst').forEach(b => b.classList.add('hidden')); });

function bindInstall() {
    document.querySelectorAll('.inst').forEach(b => {
        b.classList.toggle('hidden', isStandalone() || !(deferredPrompt || isIOS));
        b.onclick = async () => {
            if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; bindInstall(); }
            else if (isIOS) alert('iPhone-এ ইনস্টল করতে: Safari-র Share বাটন চাপুন → "Add to Home Screen" নির্বাচন করুন।');
        };
    });
}
boot();
</script>
</body>
</html>
